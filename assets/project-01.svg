    <circle cx="825.8" cy="54" r="3.6" fill="#5b82ff"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="835.8" y="58" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#5b82ff" letter-spacing="1.5">7 OF 8 SHIPPED</text>
