<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Hardik Kathiriya — Founder at ForgeGTM, GTM and outbound systems, building toward AI engineering">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d5ef5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2d5ef5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2d5ef5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#2d5ef5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2d5ef5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#08080a"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>

    <!-- ForgeGTM mark: three descending bars, bottom bar in brand accent -->
    <g transform="translate(64,108)">
      <rect width="74" height="19" rx="2" fill="#ffffff">
        <animate attributeName="width" from="0" to="74" dur="0.7s" fill="freeze"/>
      </rect>
      <rect y="32" width="49" height="19" rx="2" fill="#ffffff" fill-opacity="0.82">
        <animate attributeName="width" from="0" to="49" begin="0.14s" dur="0.7s" fill="freeze"/>
      </rect>
      <rect y="64" width="29" height="19" rx="2" fill="#2d5ef5">
        <animate attributeName="width" from="0" to="29" begin="0.28s" dur="0.7s" fill="freeze"/>
        <animate attributeName="fill-opacity" values="1;0.55;1" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <text x="190" y="128" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1.4">
        Hardik Kathiriya
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
      </text>

      <text x="192" y="166" font-size="17" font-weight="500" fill="#8d919a" letter-spacing="0.2">
        Founder @ ForgeGTM  ·  GTM &amp; Outbound Systems  ·  Building toward AI Engineering
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.45s" fill="freeze"/>
      </text>

      <g opacity="1">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.7s" fill="freeze"/>
        <rect x="192" y="196" width="146" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#222227"/>
        <text x="210" y="216" font-size="13" font-weight="500" fill="#c9ccd2">Outbound Systems</text>

        <rect x="350" y="196" width="124" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#222227"/>
        <text x="368" y="216" font-size="13" font-weight="500" fill="#c9ccd2">Automation</text>

        <rect x="486" y="196" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#222227"/>
        <text x="504" y="216" font-size="13" font-weight="500" fill="#c9ccd2">TypeScript · Next.js</text>

        <rect x="648" y="196" width="132" height="30" rx="15" fill="#2d5ef5" fill-opacity="0.14" stroke="#2d5ef5" stroke-opacity="0.45"/>
        <text x="666" y="216" font-size="13" font-weight="500" fill="#7d9bff">Stuttgart, DE</text>
      </g>
    </g>

    <!-- travelling accent line along the bottom edge -->
    <rect x="0" y="296" width="300" height="2" fill="url(#sheen)">
      <animate attributeName="x" values="-300;1000" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect width="999" height="299" x="0.5" y="0.5" rx="16" fill="none" stroke="#222227"/>
</svg>
