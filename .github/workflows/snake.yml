# Generates the contribution-snake animation from the profile contribution graph.
#
# Output is committed to a detached `output` branch — never to `main` — so the
# generated SVGs never clutter the profile repo's history or its file list.
# The README references them from that branch via raw.githubusercontent.com.
name: Generate contribution snake

on:
  schedule:
    # Every 12 hours. The contribution graph changes slowly; more often would
    # only burn Actions minutes.
    - cron: "0 */12 * * *"
  # Lets the workflow be run by hand from the Actions tab — useful for the
  # very first run, since the schedule alone can take hours to fire.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # Required to push the generated SVGs to the `output` branch.
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
